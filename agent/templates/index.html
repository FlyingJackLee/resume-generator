<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Resume Compiler</title>
  <style>
    body{font:15px/1.55 system-ui,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;color:#202124}
    textarea,input{box-sizing:border-box;width:100%;padding:10px;margin:5px 0 16px;border:1px solid #bbb;border-radius:6px}
    textarea{min-height:280px}button{background:#b52b1d;color:white;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:32px}td,th{text-align:left;border-bottom:1px solid #ddd;padding:9px}
  </style>
</head>
<body>
  <h1>AI Resume Compiler</h1>
  <p>Master Resume 始终只读。填写一个便于生成文件名的 JD 标识，然后粘贴 JD。</p>
  <form action="/ui/runs" method="post">
    <label>JD 标识（例如 Google AI Agent）</label><input name="jd_label" required maxlength="120">
    <label>岗位 JD</label><textarea name="job_description" required minlength="20"></textarea>
    <button type="submit">开始分析</button>
  </form>
  <table><thead><tr><th>Run</th><th>JD</th><th>状态</th><th>分数</th></tr></thead><tbody>
  {% for run in runs %}<tr>
    <td><a href="/runs/{{ run.run_id }}/view">{{ run.run_id }}</a></td><td>{{ run.jd_label }}</td>
    <td>{{ run.status }}</td><td>{{ run.hiring_score if run.hiring_score is not none else '-' }}</td>
  </tr>{% endfor %}
  </tbody></table>
</body></html>
