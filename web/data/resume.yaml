sections:
  - type: paragraph
    title: {zh: "个人介绍", en: "Introduction"}
    body:
      zh: "具备五年以上软件开发经验，当前专注于 AI Agent 智能体应用开发，熟悉 ReAct、Plan-and-Execute、Reflection 等智能体范式，以及任务规划、状态管理、工具调用、记忆与上下文管理等核心机制；能够使用 LangChain、LangGraph、LangChain4j、MCP 与 RAG 等技术构建智能体及工作流。拥有扎实的 Java 后端、分布式微服务与云原生系统研发能力，同时具备全栈开发、系统架构设计、性能优化及容器化交付经验，能够独立完成从方案设计、功能研发到部署运维的完整研发流程。"
      en: "Brings 5+ years of software development experience and is currently focused on AI Agent application development, with practical knowledge of agentic patterns including ReAct, Plan-and-Execute and Reflection, as well as core mechanisms such as task planning, state management, tool use, memory and context management. Able to build agents and workflows using LangChain, LangGraph, LangChain4j, MCP and RAG. Possesses a strong foundation in Java backend engineering, distributed microservices and cloud-native systems, alongside full-stack development, architecture design, performance optimization and containerized delivery. Capable of independently delivering the complete engineering lifecycle from solution design and implementation to deployment and operations."

  - type: skills
