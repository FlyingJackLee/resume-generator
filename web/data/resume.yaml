      - label: {zh: "后端技术", en: "Backend"}
        items: {zh: "Java, Python, Spring Boot, Spring Cloud Alibaba, FastAPI, Kafka, REST API", en: "Java, Python, Spring Boot, Spring Cloud Alibaba, FastAPI, Kafka, REST API"}
      - label: {zh: "云原生与交付", en: "Cloud Native & Delivery"}
